# Deploys the site to Cloudflare Workers on every push to main.
#
# Order matters: the type check runs first so a broken build never goes out, and D1 migrations run
# before the new Worker so its queries never meet an older schema. That also means a migration has
# to work with the code that is still live while it runs: add tables and columns freely, but drop or
# rename only in a later push than the code that stops using them.
#
# Repository secrets it needs:
#   CLOUDFLARE_API_TOKEN   an API token with Account › Workers Scripts, D1 and Workers KV Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account the Worker and the D1 database live in
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time and in push order: two migrations must never run side by side, and an older
# commit must never finish after a newer one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See the comment at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: the platform binaries (workerd, esbuild, rolldown) arrive as optional
      # dependencies, so no install script is needed, and none gets to run near the deploy token.
      - run: npm ci --ignore-scripts

      - name: Type check
        run: npm run check

      # The secrets are given only to the two steps that talk to Cloudflare.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply beed-energy --remote

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
